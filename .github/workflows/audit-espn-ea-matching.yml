name: Read-only ESPN to EA squad matching audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_espn_ea_matching.py"
      - ".github/workflows/audit-espn-ea-matching.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: espn-ea-matching-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Pitchline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only audit dependencies
        run: python -m pip install --disable-pip-version-check google-cloud-firestore rapidfuzz

      - name: Check Google workload identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GCP_SERVICE_ACCOUNT" ]; then
            echo "::error::Google workload identity repository variables are not configured."
            exit 1
          fi

      - name: Authenticate to Google Cloud (keyless OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run read-only audit
        run: python scripts/audit_espn_ea_matching.py --output-dir audit-output

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: espn-ea-matching-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
